version: '3.8'

services:
  turtlebot_patrol_sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: turtlebot_patrol_sim
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - TURTLEBOT3_MODEL=burger
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../telemetry_logs:/root/turtlebot_ws/logs:rw
    ipc: host
    privileged: true
    command: ros2 launch turtlebot_patrol patrol_simulation.launch.py
